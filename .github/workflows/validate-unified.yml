name: Validate Protofin comparison
on:
  push:
    branches: [feature/unified-spytlt-comparison]
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas scikit-learn scipy pytest networkx
      - name: Offline tests
        run: python -m pytest -q unified_comparison/test_level_playing_field.py unified_comparison/test_unified.py
      - name: Verify dashboard files
        run: test -f site/unified.html && test -f site/data/unified.json
